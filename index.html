<!DOCTYPE html>
<html>
<head>
  <title>MY-EQUIPMENT</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #eef3f9, #d9e6f2);
  margin: 0;
}

.container {
  width: 92%;
  margin: auto;
  margin-top: 20px;
}

h1 {
  text-align: center;
  color: #1f4e79;
  margin-bottom: 25px;
}

/* CARD */
.card {
  background: white;
  padding: 22px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}

/* FORM */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

label {
  font-size: 12px;
  margin-bottom: 5px;
  font-weight: 600;
}

input, select {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

input:focus, select:focus {
  border-color: #1f4e79;
  outline: none;
}

/* BUTTON */
.btn-add {
  background: linear-gradient(135deg, #28a745, #1e7e34);
  color: white;
  border-radius: 10px;
  padding: 10px 16px;
  border: none;
  cursor: pointer;
}

/* SEARCH */
.search-wrapper {
  max-width: 450px;
  margin: auto;
}

#search {
  width: 100%;
  padding: 12px;
  border-radius: 30px;
  border: 1px solid #ccc;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #1f4e79;
  color: white;
  padding: 12px;
}

td {
  padding: 10px;
  text-align: center;
}

/* GROUP */
.group-row {
  background: linear-gradient(135deg, #2c5d87, #3b7cb5);
  color: white;
  font-weight: bold;
}

/* ========================= */
/* 🔥 STATUS IMPROVED */
/* ========================= */

.label {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  display: inline-block;
}

/* ✅ OK */
.status-ok {
  background: #e6f7ee;
  color: #1b8a4b;
  border: 1px solid #b7e4c7;
}

/* ⚠️ DUE SOON */
.status-warning {
  background: #fff4e5;
  color: #cc7a00;
  border: 1px solid #ffd8a8;
}

/* ❌ EXPIRED */
.status-expired {
  background: #ffe5e5;
  color: #d90429;
  border: 1px solid #ffb3b3;
  animation: blink 1s infinite;
}

/* BLINK */
@keyframes blink {
  0% { opacity: 1; }
  50% { opacity: 0.4; }
  100% { opacity: 1; }
}

/* EXPIRED ROW */
.row-expired {
  background-color: #fff5f5;
}

/* ========================= */
/* ACTION BUTTON */
/* ========================= */

.action-group {
  display: flex;
  justify-content: center;
  gap: 8px;
}

.btn-action {
  border: none;
  border-radius: 10px;
  padding: 6px 10px;
  cursor: pointer;
  transition: 0.25s ease;
}

/* EDIT */
.btn-action.edit {
  background: #e3f2fd;
  color: #1976d2;
}

.btn-action.edit:hover {
  background: #1976d2;
  color: white;
  transform: scale(1.1);
}

/* DELETE */
.btn-action.delete {
  background: #fdecea;
  color: #d32f2f;
}

.btn-action.delete:hover {
  background: #d32f2f;
  color: white;
  transform: scale(1.1);
}

</style>
</head>

<body>

<div class="container">

<h1>MY-EQUIPMENT</h1>

<!-- ADD SET -->
<div class="card">
  <h3>📦 Add Equipment Set</h3>

  <div class="form-grid">
    <div class="form-group">
      <label>Set Name</label>
      <input id="setName">
    </div>

    <div class="form-group">
      <label>Serial No</label>
      <input id="setSerial">
    </div>
  </div>

  <br>
  <button class="btn-add" onclick="addSet()">➕ Save Set</button>
</div>

<!-- ADD ITEM -->
<div class="card">
  <h3>📄 Add Item</h3>

  <label>Select Equipment Set</label>
  <select id="setSelect"></select>

  <br><br>

  <div class="form-grid">
    <div class="form-group"><label>Tag</label><input id="tag"></div>
    <div class="form-group"><label>Description</label><input id="desc"></div>
    <div class="form-group"><label>Receipt No</label><input id="resit"></div>
    <div class="form-group"><label>Quantity</label><input id="qty"></div>
    <div class="form-group"><label>Price</label><input id="price"></div>
    <div class="form-group"><label>Calibration</label><input type="date" id="cal"></div>
    <div class="form-group"><label>Validity</label><input type="number" id="validity"></div>
    <div class="form-group"><label>Purchase</label><input type="date" id="date"></div>
  </div>

  <br>
  <button class="btn-add" onclick="addEquipment()">➕ Save Item</button>
</div>

<!-- SEARCH -->
<div class="card">
  <div class="search-wrapper">
    <input id="search" onkeyup="searchTable()" placeholder="🔍 Search equipment, tag, serial...">
  </div>
</div>

<!-- TABLE -->
<div class="card">
<table>
<thead>
<tr>
  <th>No</th>
  <th>Tag</th>
  <th>Description</th>
  <th>Receipt</th>
  <th>Expiry</th>
  <th>Status</th>
  <th>Qty</th>
  <th>Price</th>
  <th>Purchase</th>
  <th>Action</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "YOUR KEY",
  authDomain: "my-equipment-a340b.firebaseapp.com",
  projectId: "my-equipment-a340b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>

<script src="script.js"></script>

</body>
</html>
