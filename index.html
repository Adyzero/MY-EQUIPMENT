<!DOCTYPE html>
<html>
<head>
  <title>MY-EQUIPMENT</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #eef2f7, #dfe9f3);
      margin: 0;
    }

    .container {
      width: 92%;
      margin: auto;
      margin-top: 20px;
    }

    h1 {
      text-align: center;
      color: #1f4e79;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    /* FORM GRID */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    input, select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 100%;
      transition: 0.2s;
    }

    input:focus, select:focus {
      border-color: #1f4e79;
      outline: none;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: #555;
    }

    /* BUTTON */
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-add {
      background: linear-gradient(135deg, #28a745, #218838);
      color: white;
    }

    .btn-delete {
      background: #dc3545;
      color: white;
    }

    .btn-add:hover {
      opacity: 0.9;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      background: #1f4e79;
      color: white;
      padding: 12px;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    tr:hover {
      background: #f8fbff;
    }

    /* 🔵 GROUP HEADER */
    .group-row {
      background: linear-gradient(135deg, #2c5d87, #3b7cb5);
      color: white;
      font-weight: bold;
    }

    .group-row td {
      text-align: left;
      padding: 14px;
      font-size: 14px;
    }

    /* INNER TABLE */
    .inner-table td {
      padding: 8px;
    }

    /* STATUS */
    .label {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }

    .label-expired { background: #dc3545; color: white; }
    .label-warning { background: #ffc107; color: black; }
    .label-ok { background: #28a745; color: white; }

    /* SEARCH */
    .search-box {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    /* SECTION TITLE */
    h3 {
      margin-bottom: 10px;
      color: #1f4e79;
    }

  </style>
</head>

<body>

<div class="container">

<h1>MY-EQUIPMENT</h1>

<!-- ADD SET -->
<div class="card">
  <h3>📦 Add Equipment Set</h3>

  <div class="form-grid">
    <input id="setName" placeholder="Set Name (FLUKE 1732)">
    <input id="setSerial" placeholder="Serial No">
  </div>

  <br>
  <button class="btn-add" onclick="addSet()">➕ Add Set</button>
</div>

<!-- ADD ITEM -->
<div class="card">
  <h3>📄 Add Item</h3>

  <label>Select Equipment Set</label>
  <select id="setSelect"></select>

  <br><br>

  <div class="form-grid">
    <input id="tag" placeholder="Tag">
    <input id="desc" placeholder="Description">
    <input id="resit" placeholder="Receipt No">
    <input id="qty" placeholder="Quantity">
    <input id="price" placeholder="Price (RM)">

    <div>
      <label>Calibration Date</label>
      <input type="date" id="cal">
    </div>

    <div>
      <label>Validity (Years)</label>
      <input type="number" id="validity">
    </div>

    <div>
      <label>Purchase Date</label>
      <input type="date" id="date">
    </div>

    <div>
      <label>Upload Receipt</label>
      <input type="file" id="receiptFile">
    </div>

    <div>
      <label>Upload Certificate</label>
      <input type="file" id="certFile">
    </div>
  </div>

  <br>
  <button class="btn-add" onclick="addEquipment()">➕ Save Item</button>
</div>

<!-- SEARCH -->
<div class="card">
  <input type="text" id="search" class="search-box"
    placeholder="🔍 Search equipment..."
    onkeyup="searchTable()">
</div>

<!-- TABLE -->
<div class="card">
<table>
  <thead>
    <tr>
      <th>No</th>
      <th>Tag</th>
      <th>Description</th>
      <th>Receipt</th>
      <th>Expiry</th>
      <th>Status</th>
      <th>Qty</th>
      <th>Price</th>
      <th>Purchase</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="tableBody"></tbody>
</table>
</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

</body>
</html>
