<!DOCTYPE html>
<html>
<head>
  <title>MY-EQUIPMENT</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #eef3f9, #d9e6f2);
  margin: 0;
}

.container {
  width: 92%;
  margin: auto;
  margin-top: 20px;
}

h1 {
  text-align: center;
  color: #1f4e79;
}

/* CARD */
.card {
  background: white;
  padding: 22px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}

/* FORM */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

label {
  font-size: 12px;
  font-weight: 600;
}

input, select {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

input:focus {
  border-color: #1f4e79;
}

/* BUTTON */
.btn-add {
  background: linear-gradient(135deg, #28a745, #1e7e34);
  color: white;
  border-radius: 10px;
  padding: 10px 16px;
  border: none;
  cursor: pointer;
}

/* FILE BUTTON */
.file-btn {
  border: none;
  border-radius: 6px;
  padding: 4px 6px;
  margin-top: 4px;
  cursor: pointer;
  background: #eef3f9;
  font-size: 11px;
}

/* SEARCH */
.search-wrapper {
  max-width: 450px;
  margin: auto;
}

#search {
  width: 100%;
  padding: 12px;
  border-radius: 30px;
  border: 1px solid #ccc;
}

/* TABLE */
.card table {
  width: 100%;
}

table {
  width: 100%;
  table-layout: fixed;
}

/* ✅ ONLY Description column can wrap */
td:nth-child(3) {
  white-space: normal;       /* allow wrap */
  overflow: visible;         
  text-overflow: unset;      
  word-break: break-word;    
  text-align: left;          /* optional: nicer look */
}

/* HEADER */
th {
  background: #1f4e79;
  color: white;
  padding: 8px 6px;
  font-size: 11px;
}

/* BODY */
tbody td {
  font-size: 11px;
  padding: 6px 6px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* COLUMN WIDTH CONTROL */
th:nth-child(1), td:nth-child(1) { width: 30px; }   /* No */
th:nth-child(2), td:nth-child(2) { width: 110px; }  /* Tag */
th:nth-child(3), td:nth-child(3) { width: 160px; }  /* Description */
th:nth-child(4), td:nth-child(4) { width: 70px; }  /* Receipt */
th:nth-child(5), td:nth-child(5) { width: 70px; }  /* Expiry */
th:nth-child(6), td:nth-child(6) { width: 90px; }  /* Status */
th:nth-child(7), td:nth-child(7) { width: 90px; }  /* Qty */
th:nth-child(8), td:nth-child(8) { width: 90px; }  /* Price */
th:nth-child(9), td:nth-child(9) { width: 90px; }  /* Purchase */
th:nth-child(10), td:nth-child(10) { width: 70px; } /* Action */

/* GROUP */
.group-row {
  background: linear-gradient(135deg, #2c5d87, #3b7cb5);
  color: white;
  font-weight: bold;
}

/* STATUS */
.label {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
}

.status-ok { background: #e6f7ee; color: #1b8a4b; }
.status-warning { background: #fff4e5; color: #cc7a00; }
.status-expired {
  background: #ffe5e5;
  color: #d90429;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: 0.4; }
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
}

.close {
  position: absolute;
  top: 10px;
  right: 25px;
  font-size: 30px;
  cursor: pointer;
}

/* IMAGE MODAL */
#imageModal {
  display: none;
  position: fixed;
  z-index: 9999;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
}

#modalImg {
  display: block;
  margin: auto;
  margin-top: 60px;
  max-width: 90%;
  max-height: 90%;
  border-radius: 10px;
  box-shadow: 0 0 20px #000;
}

/* TAG */
.tag-link {
  color: blue;
  cursor: pointer;
  text-decoration: underline;
  font-size: 11px;
}
</style>
</head>

<body>

<div class="container">

<h1>MY-EQUIPMENT</h1>

<!-- ADD SET -->
<div class="card">
  <h3>📦 Add Equipment Set</h3>

  <div class="form-grid">
    <div class="form-group">
      <label>Set Name</label>
      <input id="setName">
    </div>

    <div class="form-group">
      <label>Serial No</label>
      <input id="setSerial">
    </div>
  </div>

  <br>
  <button class="btn-add" onclick="addSet()">➕ Save Set</button>
</div>

<!-- ADD ITEM -->
<div class="card">
  <h3>📄 Add Item</h3>

  <label>Select Equipment Set</label>
  <select id="setSelect"></select>

  <br><br>

  <div class="form-grid">
    <div class="form-group"><label>Tag</label><input id="tag"></div>
    <div class="form-group"><label>Description</label><input id="desc"></div>
    <div class="form-group"><label>Receipt No</label><input id="resit"></div>
    <div class="form-group"><label>Quantity</label><input id="qty"></div>
    <div class="form-group"><label>Price</label><input id="price"></div>
    <div class="form-group"><label>Calibration</label><input type="date" id="cal"></div>
    <div class="form-group"><label>Validity</label><input type="number" id="validity"></div>
    <div class="form-group"><label>Purchase</label><input type="date" id="date"></div>

    <div class="form-group">
      <label>Upload Receipt</label>
      <input type="file" id="receiptFile">
    </div>

    <div class="form-group">
      <label>Upload Certificate</label>
      <input type="file" id="certFile">
    </div>

    <div class="form-group">
      <label>Upload Item Image</label>
      <input type="file" id="itemImage" accept="image/*">
    </div>
  </div>

  <br>
  <button class="btn-add" onclick="addEquipment()">➕ Save Item</button>
</div>

<!-- SEARCH -->
<div class="card">
  <div class="search-wrapper">
    <input id="search" onkeyup="searchTable()" placeholder="🔍 Search equipment...">
  </div>
</div>

<!-- SUMMARY -->
<div class="card" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">

  <div><b>Total Items:</b> <span id="totalItems">0</span></div>

  <div><b>Total Value:</b> <span id="totalValue">RM 0.00</span></div>

  <div style="color:#d90429;">
    <b>Expired:</b> <span id="totalExpired">0</span>
  </div>

  <div style="color:#cc7a00;">
    <b>Due Soon:</b> <span id="totalDue">0</span>
  </div>

</div>

<!-- TABLE -->
<div class="card">
<table>
<thead>
<tr>
  <th>No</th>
  <th>Tag</th>
  <th>Description</th>
  <th>Receipt No. & Cert</th>
  <th>Expiry</th>
  <th>Status</th>
  <th>Qty</th>
  <th>Price</th>
  <th>Purchase</th>
  <th>Action</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<!-- MODAL -->
<div id="fileModal" class="modal">
  <div style="
    position:absolute;
    top:5%;
    left:5%;
    width:90%;
    height:90%;
    background:white;
    border-radius:10px;
    overflow:hidden;
  ">
    <span class="close" onclick="closeModal()">&times;</span>
    <iframe id="fileFrame" style="width:100%; height:100%; border:none;"></iframe>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

const firebaseConfig = {

  authDomain: "my-equipment-a340b.firebaseapp.com",

  storageBucket: "my-equipment-a340b.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();
</script>

<script src="script.js"></script>

</body>
</html>

<div id="imageModal" style="
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
  z-index:9999;
">
  <img id="modalImg" style="
    max-width:90%;
    max-height:90%;
    border-radius:10px;
    box-shadow:0 0 20px #000;
  ">
</div>
