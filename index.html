<!DOCTYPE html>
<html>
<head>
  <title>MY-EQUIPMENT</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

 <style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #eef2f7, #dfe9f3);
    margin: 0;
  }

  .container {
    width: 92%;
    margin: auto;
    margin-top: 20px;
  }

  h1 {
    text-align: center;
    color: #1f4e79;
    margin-bottom: 25px;
    letter-spacing: 1px;
  }

  /* CARD */
  .card {
    background: white;
    padding: 22px;
    border-radius: 16px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    transition: 0.3s;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.12);
  }

  h3 {
    color: #1f4e79;
    margin-bottom: 15px;
  }

  /* FORM GRID */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group.full {
    grid-column: span 2;
  }

  label {
    font-size: 12px;
    margin-bottom: 5px;
    font-weight: 600;
    color: #555;
  }

  /* INPUT */
  input, select {
    padding: 11px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 13px;
    transition: 0.25s;
  }

  input:hover, select:hover {
    border-color: #1f4e79;
  }

  input:focus, select:focus {
    border-color: #1f4e79;
    box-shadow: 0 0 8px rgba(31,78,121,0.15);
    outline: none;
  }

  /* BUTTON */
  button {
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.25s;
  }

  .btn-add {
    background: linear-gradient(135deg, #28a745, #218838);
    color: white;
  }

  .btn-add:hover {
    transform: scale(1.05);
  }

  .btn-delete {
    background: #dc3545;
    color: white;
  }

  .btn-delete:hover {
    background: #b02a37;
  }

  /* SEARCH */
  .search-wrapper {
    max-width: 450px;
    margin: auto;
  }

  #search {
    width: 100%;
    padding: 12px 18px;
    border-radius: 30px;
    border: 1px solid #ccc;
    font-size: 14px;
    transition: 0.3s;
  }

  #search:focus {
    border-color: #1f4e79;
    box-shadow: 0 0 10px rgba(31,78,121,0.2);
  }

  /* TABLE */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    background: #1f4e79;
    color: white;
    padding: 13px;
  }

  td {
    padding: 11px;
    border-bottom: 1px solid #eee;
    text-align: center;
  }

  /* NORMAL ROW HOVER */
  tr:hover:not(.group-row) {
    background: #f5f9ff;
  }

  /* GROUP HEADER (IMPORTANT FIX) */
  .group-row {
    background: linear-gradient(135deg, #2c5d87, #3b7cb5);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.25s;
  }

  .group-row td {
    text-align: left;
    padding: 14px;
    font-size: 14px;
  }

  .group-row:hover {
    background: linear-gradient(135deg, #244b6f, #346c9c);
    transform: scale(1.01);
  }

  .group-row:hover td {
    color: white;
  }

  /* STATUS */
  .label {
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: bold;
  }

  .label-expired { background: #dc3545; color: white; }
  .label-warning { background: #ffc107; color: black; }
  .label-ok { background: #28a745; color: white; }

</style>
</head>

<body>

<div class="container">

<h1>MY-EQUIPMENT</h1>

<!-- ADD SET -->
<div class="card">
  <h3>📦 Add Equipment Set</h3>

  <div class="form-grid">
    <div class="form-group">
      <label>Set Name</label>
      <input id="setName">
    </div>

    <div class="form-group">
      <label>Serial No</label>
      <input id="setSerial">
    </div>
  </div>

  <br>
  <button class="btn-add" onclick="addSet()">➕ Add Set</button>
</div>

<!-- ADD ITEM -->
<div class="card">
  <h3>📄 Add Item</h3>

  <label>Select Equipment Set</label>
  <select id="setSelect"></select>

  <br><br>

  <div class="form-grid">

    <div class="form-group">
      <label>Tag</label>
      <input id="tag">
    </div>

    <div class="form-group">
      <label>Description</label>
      <input id="desc">
    </div>

    <div class="form-group">
      <label>Receipt No</label>
      <input id="resit">
    </div>

    <div class="form-group">
      <label>Quantity</label>
      <input id="qty">
    </div>

    <div class="form-group">
      <label>Price (RM)</label>
      <input id="price">
    </div>

    <div class="form-group">
      <label>Calibration Date</label>
      <input type="date" id="cal">
    </div>

    <div class="form-group">
      <label>Validity (Years)</label>
      <input type="number" id="validity">
    </div>

    <div class="form-group">
      <label>Purchase Date</label>
      <input type="date" id="date">
    </div>

    <div class="form-group full">
      <label>Upload Receipt</label>
      <input type="file" id="receiptFile">
    </div>

    <div class="form-group full">
      <label>Upload Certificate</label>
      <input type="file" id="certFile">
    </div>

  </div>

  <br>
  <button class="btn-add" onclick="addEquipment()">➕ Save Item</button>
</div>

<!-- SEARCH -->
<div class="card">
  <div class="search-wrapper">
    <input type="text" id="search"
      placeholder="🔍 Search equipment, tag, serial..."
      onkeyup="searchTable()">
  </div>
</div>

<!-- TABLE -->
<div class="card">
<table>
  <thead>
    <tr>
      <th>No</th>
      <th>Tag</th>
      <th>Description</th>
      <th>Receipt</th>
      <th>Expiry</th>
      <th>Status</th>
      <th>Qty</th>
      <th>Price</th>
      <th>Purchase</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="tableBody"></tbody>
</table>
</div>

</div>

</body>
</html>
