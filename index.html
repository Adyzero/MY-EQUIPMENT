<!DOCTYPE html>
<html>
<head>
  <title>MY-EQUIPMENT</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #eef3f9, #d9e6f2);
  margin: 0;
}

.container {
  width: 92%;
  margin: auto;
  margin-top: 20px;
}

h1 {
  text-align: center;
  color: #1f4e79;
}

/* CARD */
.card {
  background: white;
  padding: 22px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}

/* FORM */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

label {
  font-size: 12px;
  font-weight: 600;
}

input, select {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

input:focus {
  border-color: #1f4e79;
}

/* BUTTON */
.btn-add {
  background: linear-gradient(135deg, #28a745, #1e7e34);
  color: white;
  border-radius: 10px;
  padding: 10px 16px;
  border: none;
  cursor: pointer;
}

/* FILE BUTTON */
.file-btn {
  border: none;
  border-radius: 6px;
  padding: 5px 8px;
  margin-top: 4px;
  cursor: pointer;
  background: #eef3f9;
}

/* SEARCH */
.search-wrapper {
  max-width: 450px;
  margin: auto;
}

#search {
  width: 100%;
  padding: 12px;
  border-radius: 30px;
  border: 1px solid #ccc;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #1f4e79;
  color: white;
  padding: 12px;
}

td {
  padding: 10px;
  text-align: center;
}

/* GROUP */
.group-row {
  background: linear-gradient(135deg, #2c5d87, #3b7cb5);
  color: white;
  font-weight: bold;
}

/* STATUS */
.label {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
}

.status-ok { background: #e6f7ee; color: #1b8a4b; }
.status-warning { background: #fff4e5; color: #cc7a00; }
.status-expired {
  background: #ffe5e5;
  color: #d90429;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: 0.4; }
}

.row-expired {
  background: #fff5f5;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
}

.modal iframe {
  width: 90%;
  height: 90%;
  margin: 40px auto;
  display: block;
  border-radius: 10px;
  background: white;
}

.close {
  position: absolute;
  top: 10px;
  right: 25px;
  color: white;
  font-size: 35px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>MY-EQUIPMENT</h1>

<!-- ADD SET -->
<div class="card">
  <h3>📦 Add Equipment Set</h3>

  <div class="form-grid">
    <div class="form-group">
      <label>Set Name</label>
      <input id="setName">
    </div>

    <div class="form-group">
      <label>Serial No</label>
      <input id="setSerial">
    </div>
  </div>

  <br>
  <button class="btn-add" onclick="addSet()">➕ Save Set</button>
</div>

<!-- ADD ITEM -->
<div class="card">
  <h3>📄 Add Item</h3>

  <label>Select Equipment Set</label>
  <select id="setSelect"></select>

  <br><br>

  <div class="form-grid">
    <div class="form-group"><label>Tag</label><input id="tag"></div>
    <div class="form-group"><label>Description</label><input id="desc"></div>
    <div class="form-group"><label>Receipt No</label><input id="resit"></div>
    <div class="form-group"><label>Quantity</label><input id="qty"></div>
    <div class="form-group"><label>Price</label><input id="price"></div>
    <div class="form-group"><label>Calibration</label><input type="date" id="cal"></div>
    <div class="form-group"><label>Validity</label><input type="number" id="validity"></div>
    <div class="form-group"><label>Purchase</label><input type="date" id="date"></div>

    <div class="form-group">
      <label>Upload Receipt</label>
      <input type="file" id="receiptFile">
    </div>

    <div class="form-group">
      <label>Upload Certificate</label>
      <input type="file" id="certFile">
    </div>
  </div>

  <br>
  <button class="btn-add" onclick="addEquipment()">➕ Save Item</button>
</div>

<!-- SEARCH -->
<div class="card">
  <div class="search-wrapper">
    <input id="search" onkeyup="searchTable()" placeholder="🔍 Search equipment...">
  </div>
</div>

<!-- TABLE -->
<div class="card">
<table>
<thead>
<tr>
  <th>No</th>
  <th>Tag</th>
  <th>Description</th>
  <th>Receipt No. & Cert</th>
  <th>Expiry</th>
  <th>Status</th>
  <th>Qty</th>
  <th>Price</th>
  <th>Purchase</th>
  <th>Action</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<!-- MODAL -->
<div id="fileModal" class="modal">
  <div style="
    position:absolute;
    top:5%;
    left:5%;
    width:90%;
    height:90%;
    background:white;
    border-radius:10px;
    overflow:hidden;
  ">

    <span class="close" onclick="closeModal()" style="
      position:absolute;
      top:10px;
      right:20px;
      color:black;
      font-size:30px;
      z-index:10;
      cursor:pointer;
    ">&times;</span>

    <iframe id="fileFrame" style="
      width:100%;
      height:100%;
      border:none;
    "></iframe>

  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

const firebaseConfig = {

  storageBucket: "my-equipment-a340b.firebasestorage.app"
};

const db = firebase.firestore();

</script>

<script src="script.js"></script>

</body>
</html>
